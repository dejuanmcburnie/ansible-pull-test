user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    '"$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Target service (in another namespace/network). Port must match the
    # backend's HTTPS port.
    upstream backend1 {
        server 10.200.12.21:443;
        keepalive 16;
    }

    # Redirect plain HTTP to HTTPS
    server {
        listen 80;
        server_name mcp-prod.us.payfactors.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name mcp.example.com;

        ssl_certificate     /etc/letsencrypt/live/mcp-prod.us.payfactors.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mcp-prod.us.payfactors.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location / {
            proxy_pass https://backend1;
            proxy_http_version 1.1;

            # TLS to the backend (SNI and certificate verification)
            proxy_ssl_server_name on;
            proxy_ssl_name        mcp-prod.us.payfactors.com;   # name on the backend's cert
            proxy_ssl_protocols   TLSv1.2 TLSv1.3;
            proxy_ssl_verify      on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_trusted_certificate /etc/nginx/certs/backend-ca.pem;

            # Headers
            proxy_set_header Host              mcp-prod.us.payfactors.com;
            proxy_set_header Connection        "";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming support for MCP (SSE / streamable HTTP)
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
            proxy_buffering     off;
            proxy_cache         off;
            chunked_transfer_encoding on;
        }
    }
}
